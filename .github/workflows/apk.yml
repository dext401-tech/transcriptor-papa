name: APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descomprimir proyecto
        run: unzip -q -o transcriptor-papa.zip

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Compilar
        working-directory: transcriptor-papa
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Renombrar APK
        run: cp transcriptor-papa/app/build/outputs/apk/debug/app-debug.apk TranscriptorPapa.apk

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}-apk
          name: Transcriptor v1.0.${{ github.run_number }}
          body: Descarga TranscriptorPapa.apk e instálala en el celular.
          files: TranscriptorPapa.apk
